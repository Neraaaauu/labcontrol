{% extends "base.html" %}

{% block title %}Editar Paciente - LabControl{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-12 col-lg-10 col-xl-9">
        <div class="d-flex justify-content-between align-items-center mb-3 pb-2 border-bottom">
            <div>
                <h1 class="h4 mb-0 fw-semibold text-dark">Editar Expediente</h1>
                <p class="text-muted small mb-0">{{ paciente.nombre }} {{ paciente.apellido }} (ID #{{ paciente.id }})</p>
            </div>
            <a href="{{ url_for('detalle_paciente', id=paciente.id) }}" class="btn btn-sm btn-subtle">
                &larr; Volver
            </a>
        </div>

        <div class="panel-clinical p-4">
            <form method="POST" action="{{ url_for('editar_paciente', id=paciente.id) }}">
                <div class="mb-4">
                    <div class="small text-secondary fw-semibold text-uppercase mb-3 pb-1 border-bottom" style="font-size: 0.75rem; letter-spacing: 0.04em;">
                        1. Información General
                    </div>
                    <div class="row g-3">
                        <div class="col-md-6">
                            <label for="nombre" class="form-label">Nombre(s) <span class="text-danger">*</span></label>
                            <input type="text" class="form-control" id="nombre" name="nombre" value="{{ paciente.nombre }}" required>
                        </div>
                        <div class="col-md-6">
                            <label for="apellido" class="form-label">Apellidos <span class="text-danger">*</span></label>
                            <input type="text" class="form-control" id="apellido" name="apellido" value="{{ paciente.apellido }}" required>
                        </div>

                        <div class="col-md-4">
                            <label for="curp" class="form-label">CURP</label>
                            <input type="text" class="form-control text-uppercase font-monospace" id="curp" name="curp" maxlength="18" value="{{ paciente.curp or '' }}">
                        </div>

                        <div class="col-md-4">
                            <label for="fecha_nacimiento" class="form-label">Fecha de Nacimiento</label>
                            <input type="date" class="form-control font-tabular" id="fecha_nacimiento" name="fecha_nacimiento" value="{{ paciente.fecha_nacimiento or '' }}">
                        </div>

                        <div class="col-md-4">
                            <label for="sexo" class="form-label">Sexo Biológico</label>
                            <select class="form-select" id="sexo" name="sexo">
                                <option value="" {% if not paciente.sexo %}selected{% endif %}>Seleccionar...</option>
                                <option value="M" {% if paciente.sexo == 'M' %}selected{% endif %}>Masculino</option>
                                <option value="F" {% if paciente.sexo == 'F' %}selected{% endif %}>Femenino</option>
                                <option value="O" {% if paciente.sexo == 'O' %}selected{% endif %}>Otro / No especificado</option>
                            </select>
                        </div>
                    </div>
                </div>

                <div class="mb-4">
                    <div class="small text-secondary fw-semibold text-uppercase mb-3 pb-1 border-bottom" style="font-size: 0.75rem; letter-spacing: 0.04em;">
                        2. Contacto
                    </div>
                    <div class="row g-3">
                        <div class="col-md-6">
                            <label for="telefono" class="form-label">Teléfono</label>
                            <input type="tel" class="form-control font-tabular" id="telefono" name="telefono" value="{{ paciente.telefono or '' }}">
                        </div>
                        <div class="col-md-6">
                            <label for="email" class="form-label">Correo Electrónico</label>
                            <input type="email" class="form-control" id="email" name="email" value="{{ paciente.email or '' }}">
                        </div>
                    </div>
                </div>

                <div class="mb-4">
                    <div class="small text-secondary fw-semibold text-uppercase mb-3 pb-1 border-bottom" style="font-size: 0.75rem; letter-spacing: 0.04em;">
                        3. Domicilio
                    </div>
                    <div class="row g-3">
                        <div class="col-md-4">
                            <label for="codigo_postal" class="form-label">Código Postal</label>
                            <input type="text" class="form-control font-monospace" id="codigo_postal" name="codigo_postal" maxlength="5" value="{{ paciente.codigo_postal or '' }}">
                        </div>
                        <div class="col-md-4">
                            <label for="estado" class="form-label">Estado</label>
                            <input type="text" class="form-control" id="estado" name="estado" value="{{ paciente.estado or '' }}">
                        </div>
                        <div class="col-md-4">
                            <label for="municipio" class="form-label">Municipio</label>
                            <input type="text" class="form-control" id="municipio" name="municipio" value="{{ paciente.municipio or '' }}">
                        </div>
                        <div class="col-md-6">
                            <label for="colonia" class="form-label">Colonia</label>
                            <input type="text" class="form-control" id="colonia" name="colonia" value="{{ paciente.colonia or '' }}">
                        </div>
                        <div class="col-md-6">
                            <label for="direccion_calle" class="form-label">Calle y Número</label>
                            <input type="text" class="form-control" id="direccion_calle" name="direccion_calle" value="{{ paciente.direccion_calle or '' }}">
                        </div>
                    </div>
                </div>

                <div class="d-flex justify-content-end gap-2 pt-3 border-top">
                    <a href="{{ url_for('detalle_paciente', id=paciente.id) }}" class="btn btn-subtle">Cancelar</a>
                    <button type="submit" class="btn btn-steel">
                        Guardar Cambios
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
