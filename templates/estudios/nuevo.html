{% extends "base.html" %}

{% block title %}Nuevo Estudio Clínico - LabControl{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-12 col-lg-8">
        <div class="d-flex justify-content-between align-items-center mb-3 pb-2 border-bottom">
            <div>
                <h1 class="h4 mb-0 fw-semibold text-dark">Alta de Estudio Clínico</h1>
                <p class="text-muted small mb-0">Catálogo de pruebas de laboratorio.</p>
            </div>
            <a href="{{ url_for('catalogo_estudios') }}" class="btn btn-sm btn-subtle">
                &larr; Volver
            </a>
        </div>

        <div class="panel-clinical p-4">
            <form method="POST" action="{{ url_for('nuevo_estudio') }}">
                <div class="row g-3">
                    <div class="col-md-4">
                        <label for="codigo" class="form-label">Código / Clave <span class="text-danger">*</span></label>
                        <input type="text" class="form-control font-monospace text-uppercase" id="codigo" name="codigo" value="{{ form.get('codigo', '') }}" placeholder="Ej. PCR-01" required>
                    </div>
                    <div class="col-md-8">
                        <label for="nombre" class="form-label">Nombre del Estudio <span class="text-danger">*</span></label>
                        <input type="text" class="form-control" id="nombre" name="nombre" value="{{ form.get('nombre', '') }}" placeholder="Ej. Proteína C Reactiva" required>
                    </div>

                    <div class="col-md-6">
                        <label for="categoria" class="form-label">Categoría / Área</label>
                        <select class="form-select" id="categoria" name="categoria">
                            <option value="Hematología">Hematología</option>
                            <option value="Bioquímica Clínica" selected>Bioquímica Clínica</option>
                            <option value="Inmunología">Inmunología</option>
                            <option value="Uroanálisis">Uroanálisis</option>
                            <option value="Coprología">Coprología</option>
                            <option value="Microbiología">Microbiología</option>
                            <option value="Endocrinología">Endocrinología</option>
                        </select>
                    </div>

                    <div class="col-md-6">
                        <label for="tipo_muestra" class="form-label">Tipo de Muestra <span class="text-danger">*</span></label>
                        <input type="text" class="form-control" id="tipo_muestra" name="tipo_muestra" value="{{ form.get('tipo_muestra', '') }}" placeholder="Ej. Sangre venosa - Tubo lila EDTA" required>
                    </div>

                    <div class="col-12">
                        <label for="descripcion" class="form-label">Descripción</label>
                        <textarea class="form-control" id="descripcion" name="descripcion" rows="2" placeholder="Resumen del análisis...">{{ form.get('descripcion', '') }}</textarea>
                    </div>

                    <div class="col-12">
                        <label for="indicaciones" class="form-label">Indicaciones / Ayuno</label>
                        <input type="text" class="form-control" id="indicaciones" name="indicaciones" value="{{ form.get('indicaciones', '') }}" placeholder="Ej. Ayuno de 8 horas...">
                    </div>

                    <div class="col-md-6">
                        <label for="precio" class="form-label">Tarifa ($ MXN) <span class="text-danger">*</span></label>
                        <input type="number" step="0.01" class="form-control font-tabular" id="precio" name="precio" value="{{ form.get('precio', '150.00') }}" required>
                    </div>

                    <div class="col-md-6">
                        <label for="tiempo_entrega_horas" class="form-label">Tiempo de Entrega (Horas)</label>
                        <input type="number" class="form-control font-tabular" id="tiempo_entrega_horas" name="tiempo_entrega_horas" value="{{ form.get('tiempo_entrega_horas', '24') }}">
                    </div>
                </div>

                <div class="d-flex justify-content-end gap-2 pt-3 border-top mt-4">
                    <a href="{{ url_for('catalogo_estudios') }}" class="btn btn-subtle">Cancelar</a>
                    <button type="submit" class="btn btn-steel">
                        Guardar Estudio
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
