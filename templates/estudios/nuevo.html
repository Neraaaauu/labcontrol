{% extends "base.html" %}

{% block title %}Nuevo Estudio Clínico - LabControl{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-12 col-lg-8">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <div>
                <h2 class="h3 fw-bold text-primary mb-1">
                    <i class="bi bi-plus-circle me-2"></i> Alta de Estudio Clínico
                </h2>
                <p class="text-muted mb-0">Administración del catálogo de pruebas de laboratorio.</p>
            </div>
            <a href="{{ url_for('catalogo_estudios') }}" class="btn btn-outline-secondary">
                <i class="bi bi-arrow-left me-1"></i> Volver al Catálogo
            </a>
        </div>

        <div class="card border-0 shadow-sm rounded-3">
            <div class="card-body p-4">
                <form method="POST" action="{{ url_for('nuevo_estudio') }}">
                    <div class="row g-3">
                        <div class="col-md-4">
                            <label for="codigo" class="form-label fw-semibold">Código / Clave <span class="text-danger">*</span></label>
                            <input type="text" class="form-control font-monospace text-uppercase" id="codigo" name="codigo" value="{{ form.get('codigo', '') }}" placeholder="Ej. PCR-01" required>
                        </div>
                        <div class="col-md-8">
                            <label for="nombre" class="form-label fw-semibold">Nombre del Estudio <span class="text-danger">*</span></label>
                            <input type="text" class="form-control" id="nombre" name="nombre" value="{{ form.get('nombre', '') }}" placeholder="Ej. Proteína C Reactiva Cuantitativa" required>
                        </div>

                        <div class="col-md-6">
                            <label for="categoria" class="form-label fw-semibold">Categoría / Área</label>
                            <select class="form-select" id="categoria" name="categoria">
                                <option value="Hematología">Hematología</option>
                                <option value="Bioquímica Clínica" selected>Bioquímica Clínica</option>
                                <option value="Inmunología">Inmunología</option>
                                <option value="Uroanálisis">Uroanálisis</option>
                                <option value="Coprología">Coprología</option>
                                <option value="Microbiología">Microbiología</option>
                                <option value="Endocrinología">Endocrinología</option>
                            </select>
                        </div>

                        <div class="col-md-6">
                            <label for="tipo_muestra" class="form-label fw-semibold">Tipo de Muestra <span class="text-danger">*</span></label>
                            <input type="text" class="form-control" id="tipo_muestra" name="tipo_muestra" value="{{ form.get('tipo_muestra', '') }}" placeholder="Ej. Sangre venosa - Tubo lila EDTA" required>
                        </div>

                        <div class="col-12">
                            <label for="descripcion" class="form-label fw-semibold">Descripción Clínica</label>
                            <textarea class="form-control" id="descripcion" name="descripcion" rows="2" placeholder="Breve resumen de qué evalúa este análisis...">{{ form.get('descripcion', '') }}</textarea>
                        </div>

                        <div class="col-12">
                            <label for="indicaciones" class="form-label fw-semibold">Indicaciones de Preparación / Ayuno</label>
                            <input type="text" class="form-control" id="indicaciones" name="indicaciones" value="{{ form.get('indicaciones', '') }}" placeholder="Ej. Ayuno estricto de 8 horas. No ingerir alcohol 24 hrs antes.">
                        </div>

                        <div class="col-md-6">
                            <label for="precio" class="form-label fw-semibold">Precio al Público ($ MXN) <span class="text-danger">*</span></label>
                            <div class="input-group">
                                <span class="input-group-text">$</span>
                                <input type="number" step="0.01" class="form-control" id="precio" name="precio" value="{{ form.get('precio', '150.00') }}" required>
                            </div>
                        </div>

                        <div class="col-md-6">
                            <label for="tiempo_entrega_horas" class="form-label fw-semibold">Tiempo Estimado de Entrega (Horas)</label>
                            <div class="input-group">
                                <input type="number" class="form-control" id="tiempo_entrega_horas" name="tiempo_entrega_horas" value="{{ form.get('tiempo_entrega_horas', '24') }}">
                                <span class="input-group-text">horas</span>
                            </div>
                        </div>
                    </div>

                    <div class="d-flex justify-content-end gap-2 pt-4 border-top mt-4">
                        <a href="{{ url_for('catalogo_estudios') }}" class="btn btn-outline-secondary px-4">Cancelar</a>
                        <button type="submit" class="btn btn-primary px-4 fw-bold shadow-sm">
                            <i class="bi bi-check2 me-1"></i> Guardar en Catálogo
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
